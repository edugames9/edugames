<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths Practice</title><style>body{font-family:Arial;background:#f3e8ff;padding:20px;text-align:center}.card{background:#fff;max-width:900px;margin:auto;padding:20px;border-radius:20px}.btn,.answer{display:block;width:100%;max-width:500px;margin:8px auto;padding:14px;border:none;border-radius:12px;background:#8b5cf6;color:#fff;font-size:18px}.home{display:inline-block;margin-bottom:15px;padding:10px 20px;background:#8b5cf6;color:#fff;text-decoration:none;border-radius:10px}</style></head><body><a class="home" href="index.html">🏠 Home</a><div class="card"><div id="menu"><h1>🔢 Maths Practice</h1><button class="btn" onclick="start('add20')">➕ Adding to 20</button><button class="btn" onclick="start('sub20')">➖ Subtracting to 20</button><button class="btn" onclick="start('add100')">➕ Adding to 100</button><button class="btn" onclick="start('sub100')">➖ Subtracting to 100</button><button class="btn" onclick="start('shapes')">🔺 Shapes</button><button class="btn" onclick="start('time')">🕒 Time</button><button class="btn" onclick="start('money')">💰 Money</button><button class="btn" onclick="start('tt2')">✖️ 2 Times Table</button><button class="btn" onclick="start('tt3')">✖️ 3 Times Table</button><button class="btn" onclick="start('tt5')">✖️ 5 Times Table</button></div><div id="quiz" style="display:none"><h2 id="prog"></h2><h2 id="question"></h2><div id="answers"></div></div></div><script>let cat='',qn=0,score=0,correct='';const TOTAL=10;const shapes=[['How many sides does a triangle have?','3',['2','3','4','5']],['Which shape has no corners?','Circle',['Circle','Square','Triangle','Rectangle']],['Which shape has 4 equal sides?','Square',['Rectangle','Circle','Square','Triangle']]];const times=[['Half past 3 is?','3:30',['3:15','3:30','3:45','4:00']],['One hour after 5 o'clock?','6',['4','5','6','7']],['Quarter past 4 is?','4:15',['4:15','4:30','4:45','5:15']]];const money=[['10p + 20p = ?','30p',['20p','30p','40p','50p']],['50p - 20p = ?','30p',['20p','30p','40p','50p']],['Which is worth more?','50p',['10p','20p','50p','5p']]];function r(n){return Math.floor(Math.random()*n)}function start(c){cat=c;qn=0;score=0;menu.style.display='none';quiz.style.display='block';nextQ()}function nextQ(){if(qn>=TOTAL){question.innerHTML='🏆 Finished!<br>Score: '+score+'/10';answers.innerHTML='<button class="btn" onclick="location.reload()">Play Again</button>';prog.innerHTML='';return;}prog.innerHTML='Question '+(qn+1)+' of 10 | Score '+score;let opts=[];switch(cat){case 'add20':{let a=r(11),b=r(11);correct=a+b;question.innerText=a+' + '+b+' = ?';break;}case 'sub20':{let a=10+r(11),b=r(a);correct=a-b;question.innerText=a+' - '+b+' = ?';break;}case 'add100':{let a=10+r(90),b=1+r(20);correct=a+b;question.innerText=a+' + '+b+' = ?';break;}case 'sub100':{let a=30+r(70),b=r(30);correct=a-b;question.innerText=a+' - '+b+' = ?';break;}case 'tt2':{let n=1+r(12);correct=n*2;question.innerText='2 × '+n+' = ?';break;}case 'tt3':{let n=1+r(12);correct=n*3;question.innerText='3 × '+n+' = ?';break;}case 'tt5':{let n=1+r(12);correct=n*5;question.innerText='5 × '+n+' = ?';break;}case 'shapes':{let s=shapes[r(shapes.length)];correct=s[1];question.innerText=s[0];opts=s[2];break;}case 'time':{let t=times[r(times.length)];correct=t[1];question.innerText=t[0];opts=t[2];break;}case 'money':{let m=money[r(money.length)];correct=m[1];question.innerText=m[0];opts=m[2];break;}}if(opts.length===0){opts=[correct];while(opts.length<4){let v=Number(correct)+(r(11)-5);if(!opts.includes(v))opts.push(v)}opts.sort(()=>Math.random()-.5)}answers.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.innerText=o;b.onclick=()=>{if(String(o)===String(correct))score++;qn++;nextQ()};answers.appendChild(b)})}</script></body></html>
