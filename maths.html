<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Maths Practice</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f3e8ff;
    margin:0;
    padding:20px;
    text-align:center;
}

.home{
    display:inline-block;
    background:#8b5cf6;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:12px;
    margin-bottom:15px;
    font-weight:bold;
}

.card{
    background:white;
    max-width:900px;
    margin:auto;
    border-radius:20px;
    padding:20px;
}

.btn{
    display:block;
    width:100%;
    max-width:500px;
    margin:8px auto;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#8b5cf6;
    color:white;
    font-size:20px;
}

.answer{
    display:block;
    width:100%;
    max-width:400px;
    margin:8px auto;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#60a5fa;
    color:white;
    font-size:20px;
}

</style>
</head>

<body>

<a href="index.html" class="home">🏠 Home</a>

<div class="card">

<div id="menu">

<h1>🔢 Maths Practice</h1>

<button class="btn" onclick="startQuiz('add20')">➕ Adding to 20</button>

<button class="btn" onclick="startQuiz('sub20')">➖ Subtracting to 20</button>

<button class="btn" onclick="startQuiz('add100')">➕ Adding to 100</button>

<button class="btn" onclick="startQuiz('sub100')">➖ Subtracting to 100</button>

<button class="btn" onclick="startQuiz('shapes')">🔺 Shapes</button>

<button class="btn" onclick="startQuiz('time')">🕒 Time</button>

<button class="btn" onclick="startQuiz('money')">💰 Money</button>

<button class="btn" onclick="startQuiz('tt2')">✖️ 2 Times Table</button>

<button class="btn" onclick="startQuiz('tt3')">✖️ 3 Times Table</button>

<button class="btn" onclick="startQuiz('tt5')">✖️ 5 Times Table</button>

</div>

<div id="quiz" style="display:none;">

<h2 id="progress"></h2>

<h2 id="question"></h2>

<div id="answers"></div>

</div>

</div>

<script>

var category="";
var questionNumber=0;
var score=0;
var correctAnswer="";
var TOTAL=10;

function random(max){
    return Math.floor(Math.random()*max);
}

function startQuiz(cat){

    category=cat;
    questionNumber=0;
    score=0;

    document.getElementById("menu").style.display="none";
    document.getElementById("quiz").style.display="block";

    nextQuestion();
}

function nextQuestion(){

    if(questionNumber>=TOTAL){

        finishQuiz();
        return;
    }

    document.getElementById("progress").innerHTML=
    "Question "
    +(questionNumber+1)
    +" of 10 - Score "
    +score;

    generateQuestion();
}

function generateQuestion(){

    var question="";
    var options=[];

    if(category==="add20"){

        var a=random(11);
        var b=random(11);

        correctAnswer=a+b;

        question=a+" + "+b+" = ?";
    }

    else if(category==="sub20"){

        var a=10+random(11);
        var b=random(a);

        correctAnswer=a-b;

        question=a+" - "+b+" = ?";
    }

    else if(category==="add100"){

        var a=10+random(90);
        var b=1+random(20);

        correctAnswer=a+b;

        question=a+" + "+b+" = ?";
    }

    else if(category==="sub100"){

        var a=30+random(70);
        var b=random(30);

        correctAnswer=a-b;

        question=a+" - "+b+" = ?";
    }

    else if(category==="tt2"){

        var n=1+random(12);

        correctAnswer=n*2;

        question="2 × "+n+" = ?";
    }

    else if(category==="tt3"){

        var n=1+random(12);

        correctAnswer=n*3;

        question="3 × "+n+" = ?";
    }

    else if(category==="tt5"){

        var n=1+random(12);

        correctAnswer=n*5;

        question="5 × "+n+" = ?";
    }

    else if(category==="shapes"){

        var qs=[
            ["How many sides does a triangle have?","3",["2","3","4","5"]],
            ["Which shape has no corners?","Circle",["Circle","Square","Triangle","Rectangle"]],
            ["Which shape has 4 equal sides?","Square",["Rectangle","Circle","Square","Triangle"]]
        ];

        var pick=qs[random(qs.length)];

        question=pick[0];
        correctAnswer=pick[1];
        options=pick[2];
    }

    else if(category==="time"){

        var qs=[
            ["Half past 3 is?","3:30",["3:15","3:30","3:45","4:00"]],
            ["One hour after 5 o'clock?","6",["4","5","6","7"]],
            ["Quarter past 4 is?","4:15",["4:15","4:30","4:45","5:15"]]
        ];

        var pick=qs[random(qs.length)];

        question=pick[0];
        correctAnswer=pick[1];
        options=pick[2];
    }

    else if(category==="money"){

        var qs=[
            ["10p + 20p = ?","30p",["20p","30p","40p","50p"]],
            ["50p - 20p = ?","30p",["20p","30p","40p","50p"]],
            ["Which is worth more?","50p",["10p","20p","50p","5p"]]
        ];

        var pick=qs[random(qs.length)];

        question=pick[0];
        correctAnswer=pick[1];
        options=pick[2];
    }

    document.getElementById("question").innerHTML=
    question;

    if(options.length===0){

        options=[correctAnswer];

        while(options.length<4){

            var fake=
            correctAnswer+
            (random(11)-5);

            if(options.indexOf(fake)===-1){
                options.push(fake);
            }
        }
    }

    options.sort(function(){
        return Math.random()-0.5;
    });

    var container=
    document.getElementById("answers");

    container.innerHTML="";

    for(var i=0;i<options.length;i++){

        var btn=
        document.createElement("button");

        btn.className="answer";

        btn.innerHTML=options[i];

        btn.onclick=(function(value){

            return function(){

                if(String(value)===String(correctAnswer)){
                    score++;
                }

                questionNumber++;

                nextQuestion();
            };

        })(options[i]);

        container.appendChild(btn);
    }
}

function finishQuiz(){

    document.getElementById("progress").innerHTML="";

    document.getElementById("question").innerHTML=
    "🏆 Well Done!<br><br>Score: "
    +score+
    "/10";

    document.getElementById("answers").innerHTML=
    '<button class="btn" onclick="location.reload()">Play Again</button>';
}

</script>

</body>
</html>
