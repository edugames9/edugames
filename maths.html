<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unicorn Maths Adventure</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(#f5d0fe,#dbeafe);margin:0;padding:20px;text-align:center}.card{max-width:800px;margin:auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.15)}h1{color:#9333ea}.btn{display:block;width:100%;margin:10px 0;padding:18px;border:none;border-radius:16px;background:#8b5cf6;color:#fff;font-size:1.3rem}.btn:hover{background:#7c3aed}.badge{font-size:2rem}.top{display:flex;justify-content:space-between;flex-wrap:wrap}#question{font-size:2rem;margin:25px 0}#feedback{min-height:40px;font-size:1.3rem}</style></head><body><div class="card"><h1>🦄 Unicorn Maths Adventure</h1><div class="top"><div id="progress"></div><div id="score"></div></div><div class="badge" id="stickerCount"></div><div id="question"></div><div id="answers"></div><div id="feedback"></div><div id="reward"></div></div><script>const TOTAL=20;let q=0,score=0,correct=0;function r(n){return Math.floor(Math.random()*n)}function saveSticker(s){let a=JSON.parse(localStorage.getItem('stickers')||'[]');if(!a.includes(s)){a.push(s);localStorage.setItem('stickers',JSON.stringify(a))}updateStickers()}function updateStickers(){let a=JSON.parse(localStorage.getItem('stickers')||'[]');document.getElementById('stickerCount').textContent='🏆 Stickers: '+a.join(' ')}function makeQ(){let t=r(8);if(t===0){let a=r(21),b=r(21-a);correct=a+b;return a+' + '+b+' = ?'}if(t===1){let a=10+r(41),b=r(a);correct=a-b;return a+' - '+b+' = ?'}if(t===2){let a=r(11),b=r(11);correct=a*b;return a+' × '+b+' = ?'}if(t===3){let a=r(50)+10,b=r(20)+1;correct=a+b;return a+' + '+b+' = ?'}if(t===4){correct=r(20)+1;return '□ + '+correct+' = '+(correct*2)}if(t===5){let p1=(r(5)+1)*10,p2=(r(5)+1)*10;correct=(p1+p2)/10;return p1+'p + '+p2+'p = ? (p)'}if(t===6){let h=r(12)+1;correct=h+1>12?1:h+1;return 'One hour after '+h+":00 is ?"}let a=r(100),b=r(100);correct=Math.max(a,b);return 'Which is bigger: '+a+' or '+b+' ?'}function options(){let arr=[correct];while(arr.length<4){let v=correct+(r(15)-7);if(v>=0&&!arr.includes(v))arr.push(v)}return arr.sort(()=>Math.random()-.5)}function render(){if(q>=TOTAL){document.getElementById('question').innerHTML='🏆 Quiz Complete';document.getElementById('answers').innerHTML='';document.getElementById('feedback').innerHTML='<h2>Score '+score+'/'+TOTAL+'</h2>';document.getElementById('reward').innerHTML='<button class="btn" onclick="location.reload()">Play Again</button>';if(score>=18)saveSticker('👑');return;}document.getElementById('progress').textContent='Question '+(q+1)+'/'+TOTAL;document.getElementById('score').textContent='⭐ '+score;document.getElementById('feedback').textContent='';document.getElementById('reward').textContent='';document.getElementById('question').textContent=makeQ();let html='';options().forEach(o=>html+='<button class="btn" onclick="check('+o+')">'+o+'</button>');document.getElementById('answers').innerHTML=html;}function check(v){if(v===correct){score++;document.getElementById('feedback').textContent='✅ Brilliant!';if(score===5)saveSticker('🦄');if(score===10)saveSticker('🌈');if(score===15)saveSticker('✨');}else{document.getElementById('feedback').textContent='❌ Correct answer: '+correct;}setTimeout(()=>{q++;render()},900)}updateStickers();render();</script></body></html>
