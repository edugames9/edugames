<!doctype html><html><head><link rel="stylesheet" href="style.css"></head><body><h1>🔢 Maths</h1><button onclick="start('easy')">Easy</button><button onclick="start('tricky')">Tricky</button><button onclick="start('mixed')">Mixed</button><h2 id=q></h2><div id=a></div><script>let correct=0,score=0;function r(n){return Math.floor(Math.random()*n)}function sticker(s){let x=JSON.parse(localStorage.stickers||'[]');if(!x.includes(s)){x.push(s);localStorage.stickers=JSON.stringify(x)}}function start(m){let aa=0,bb=0;if(m==='easy'){aa=r(20);bb=r(20-aa);correct=aa+bb;q.innerText=`${aa}+${bb}`;}else{aa=r(12)+1;bb=r(12)+1;correct=aa*bb;q.innerText=`${aa}×${bb}`;}a.innerHTML='';[correct,correct+1,Math.max(0,correct-1)].forEach(v=>{let b=document.createElement('button');b.innerText=v;b.onclick=()=>{if(v===correct){score++;localStorage.mathsCorrect=(+localStorage.mathsCorrect||0)+1;if(score===5)sticker('🦄')}start(m)};a.appendChild(b);});}start('easy');</script></body></html>
