<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths Practice</title><style>body{font-family:Arial,sans-serif;background:#f3e8ff;margin:0;padding:20px;text-align:center}.home{display:inline-block;background:#8b5cf6;color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;margin-bottom:15px;font-weight:bold}.card{background:#fff;max-width:900px;margin:auto;border-radius:20px;padding:20px}.btn,.answer{display:block;width:100%;max-width:520px;margin:8px auto;padding:16px;border:none;border-radius:12px;background:#8b5cf6;color:#fff;font-size:20px}.answer{background:#60a5fa}</style></head><body><a href="index.html" class="home">🏠 Home</a><div class="card"><div id="menu"><h1>🔢 Maths Practice</h1><button class="btn" data-cat="add20">➕ Adding to 20</button><button class="btn" data-cat="sub20">➖ Subtracting to 20</button><button class="btn" data-cat="add100">➕ Adding to 100</button><button class="btn" data-cat="sub100">➖ Subtracting to 100</button><button class="btn" data-cat="shapes">🔺 Shapes</button><button class="btn" data-cat="time">🕒 Time</button><button class="btn" data-cat="money">💰 Money</button><button class="btn" data-cat="tt2">✖️ 2 Times Table</button><button class="btn" data-cat="tt3">✖️ 3 Times Table</button><button class="btn" data-cat="tt5">✖️ 5 Times Table</button></div><div id="quiz" style="display:none"><h2 id="progress"></h2><h2 id="question"></h2><div id="answers"></div></div></div><script>const TOTAL=10;let cat='',q=0,score=0,correct;const shapes=[{q:'How many sides does a triangle have?',a:'3',o:['2','3','4','5']},{q:'Which shape has no corners?',a:'Circle',o:['Circle','Square','Triangle','Rectangle']},{q:'Which shape has 4 equal sides?',a:'Square',o:['Rectangle','Circle','Square','Triangle']}];const times=[{q:'Half past 3 is?',a:'3:30',o:['3:15','3:30','3:45','4:00']},{q:'One hour after 5 o'clock?',a:'6',o:['4','5','6','7']},{q:'Quarter past 4 is?',a:'4:15',o:['4:15','4:30','4:45','5:15']}];const money=[{q:'10p + 20p = ?',a:'30p',o:['20p','30p','40p','50p']},{q:'50p - 20p = ?',a:'30p',o:['20p','30p','40p','50p']},{q:'Which is worth more?',a:'50p',o:['10p','20p','50p','5p']}];document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>startQuiz(b.dataset.cat)));function r(n){return Math.floor(Math.random()*n)}function startQuiz(c){cat=c;q=0;score=0;document.getElementById('menu').style.display='none';document.getElementById('quiz').style.display='block';nextQ()}function nextQ(){if(q>=TOTAL){finish();return;}document.getElementById('progress').textContent='Question '+(q+1)+' of 10 • Score '+score;let options=[];let text='';if(cat==='add20'){let a=r(11),b=r(11);correct=a+b;text=a+' + '+b+' = ?'}else if(cat==='sub20'){let a=10+r(11),b=r(a);correct=a-b;text=a+' - '+b+' = ?'}else if(cat==='add100'){let a=10+r(90),b=1+r(20);correct=a+b;text=a+' + '+b+' = ?'}else if(cat==='sub100'){let a=30+r(70),b=r(30);correct=a-b;text=a+' - '+b+' = ?'}else if(cat==='tt2'){let n=1+r(12);correct=n*2;text='2 × '+n+' = ?'}else if(cat==='tt3'){let n=1+r(12);correct=n*3;text='3 × '+n+' = ?'}else if(cat==='tt5'){let n=1+r(12);correct=n*5;text='5 × '+n+' = ?'}else if(cat==='shapes'){let s=shapes[r(shapes.length)];text=s.q;correct=s.a;options=s.o.slice()}else if(cat==='time'){let t=times[r(times.length)];text=t.q;correct=t.a;options=t.o.slice()}else if(cat==='money'){let m=money[r(money.length)];text=m.q;correct=m.a;options=m.o.slice()}document.getElementById('question').textContent=text;if(options.length===0){options=[correct];while(options.length<4){let v=correct+(r(11)-5);if(!options.includes(v))options.push(v)}options.sort(()=>Math.random()-0.5)}let ad=document.getElementById('answers');ad.innerHTML='';options.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o;b.addEventListener('click',()=>{if(String(o)===String(correct))score++;q++;nextQ();});ad.appendChild(b);});}function finish(){document.getElementById('progress').textContent='';document.getElementById('question').innerHTML='🏆 Well Done!<br>Score: '+score+'/10';document.getElementById('answers').innerHTML='<button class="btn" onclick="location.reload()">Play Again</button>';}</script></body></html>
