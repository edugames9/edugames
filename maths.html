<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#faf5ff;padding:20px;text-align:center}.btn{padding:15px;margin:6px;border:none;border-radius:14px;background:#8b5cf6;color:white;font-size:18px}#answers button{display:block;width:100%;max-width:400px;margin:8px auto;padding:16px}.card{background:white;padding:20px;border-radius:20px;max-width:700px;margin:auto}</style></head><body><div class="card"><h1>🦄 Maths Adventure</h1><button class="btn" onclick="start('easy')">Easy</button><button class="btn" onclick="start('tricky')">Tricky</button><button class="btn" onclick="start('mixed')">Mixed</button><h2 id="mode"></h2><p id="progress"></p><h2 id="q"></h2><div id="answers"></div><p id="score"></p></div><script>let difficulty='easy',points=0,count=0,correct=0;function r(n){return Math.floor(Math.random()*n)}function start(m){difficulty=m;points=0;count=0;question()}function award(s){let a=JSON.parse(localStorage.getItem('stickers')||'[]');if(!a.includes(s)){a.push(s);localStorage.setItem('stickers',JSON.stringify(a));}}function question(){document.getElementById('mode').innerText='Mode: '+difficulty;document.getElementById('progress').innerText='Question '+(count+1)+'/20';document.getElementById('score').innerText='⭐ '+points;if(difficulty==='easy'){let a=r(20),b=r(20-a);correct=a+b;q.innerText=a+' + '+b+' = ?';}else if(difficulty==='tricky'){let a=r(12)+1,b=r(12)+1;correct=a*b;q.innerText=a+' × '+b+' = ?';}else{if(Math.random()<0.5){let a=r(20),b=r(20-a);correct=a+b;q.innerText=a+' + '+b+' = ?';}else{let a=r(12)+1,b=r(12)+1;correct=a*b;q.innerText=a+' × '+b+' = ?';}}let opts=[correct];while(opts.length<4){let v=Math.max(0,correct+r(11)-5);if(!opts.includes(v))opts.push(v);}opts.sort(()=>Math.random()-.5);answers.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='btn';b.innerText=o;b.onclick=()=>check(o);answers.appendChild(b);});}function check(v){if(v===correct){points++;if(points===5)award('🦄');if(points===10)award('🌈');if(points===20)award('👑');}count++;if(count>=20){q.innerText='Finished!';answers.innerHTML='';progress.innerText='Score '+points+'/20';return;}question();}</script></body></html>
