<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sticker Collection</title>

<style>

body{
font-family:Arial;
background:#fdf4ff;
text-align:center;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
max-width:700px;
margin:auto;
}

.sticker{
font-size:4rem;
padding:15px;
display:inline-block;
}

</style>

</head>

<body>

<div class="card">

<h1>🏆 Sticker Collection</h1>

<div id="stickers"></div>

<br><br>

<a href="index.html">🏠 Home</a>

</div>

<script>

const stickers =
JSON.parse(
localStorage.getItem("stickers") || "[]"
);

const container =
document.getElementById("stickers");

if(stickers.length===0){

container.innerHTML=
"<h3>No stickers earned yet!</h3>";

}else{

stickers.forEach(s=>{

const div=document.createElement("div");

div.className="sticker";

div.textContent=s;

container.appendChild(div);

});

}

</script>

</body>
</html>
