<!doctype html><html><head><link rel="stylesheet" href="style.css"></head><body><h1>📝 Weekly Spellings</h1><p>Update only data/week-current.json weekly</p><div id=app>Loading...</div><script>fetch('data/week-current.json').then(r=>r.json()).then(d=>{let h='<h2>'+d.title+'</h2>';d.words.forEach(w=>{h+=`<p>${w}<br><input id="${w}"><button onclick="checkWord('${w}')">Check</button></p>`});app.innerHTML=h;window.checkWord=function(w){let ok=document.getElementById(w).value.toLowerCase()===w.toLowerCase();if(ok){localStorage.spellingCorrect=(+localStorage.spellingCorrect||0)+1;alert('✅ Correct')}else{alert('❌ Try Again')}}})</script></body></html>
