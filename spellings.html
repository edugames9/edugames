<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Weekly Spellings</title>

<style>

body{

    font-family:
        "Comic Sans MS",
        "Trebuchet MS",
        sans-serif;

    background:#f3e8ff;

    margin:0;

    padding:20px;

    text-align:center;
}

.home{

    display:inline-block;

    background:#8b5cf6;

    color:white;

    text-decoration:none;

    padding:12px 20px;

    border-radius:12px;

    font-weight:bold;

    margin-bottom:20px;
}

.card{

    background:white;

    max-width:900px;

    margin:auto;

    border-radius:20px;

    padding:20px;
}

.sheetButton{

    display:block;

    width:100%;

    max-width:500px;

    margin:10px auto;

    padding:20px;

    border:none;

    border-radius:15px;

    background:#ec4899;

    color:white;

    font-size:28px;

    font-weight:bold;
}

.actionButton{

    display:block;

    width:100%;

    max-width:450px;

    margin:10px auto;

    padding:16px;

    border:none;

    border-radius:12px;

    background:#8b5cf6;

    color:white;

    font-size:22px;
}

.backButton{

    display:block;

    width:100%;

    max-width:250px;

    margin:20px auto;

    padding:14px;

    border:none;

    border-radius:12px;

    background:#64748b;

    color:white;

    font-size:18px;
}

input{

    width:90%;

    max-width:500px;

    padding:12px;

    font-size:20px;

    margin:8px;
}

img{

    max-width:100%;

    border-radius:15px;
}

h1{

    color:#7c3aed;

    font-size:48px;
}

</style>

</head>

<body>

<a href="index.html" class="home">
🏠 Home
</a>

<div class="card">

<div id="menu">

<h1>📝 Weekly Spellings</h1>

<button class="sheetButton"
onclick="showSheetMenu(1)">
📚 Worksheet 1
</button>

<button class="sheetButton"
onclick="showSheetMenu(2)">
📚 Worksheet 2
</button>

<button class="sheetButton"
onclick="showSheetMenu(3)">
📚 Worksheet 3
</button>

</div>

<div id="content"
     style="display:none;">
</div>

</div>

<script>

var currentSheet = 1;

function showSheetMenu(sheet){

    currentSheet = sheet;

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("content")
        .style.display = "block";

    document.getElementById("content")
        .innerHTML =

    '<h1>📚 Worksheet '+sheet+'</h1>'

    +

    '<button class="actionButton" onclick="showAnswers()">'

    +'📖 Study Sheet'

    +'</button>'

    +

    '<button class="actionButton" onclick="showWorksheet()">'

    +'✏️ Complete Worksheet'

    +'</button>'

    +

    '<button class="backButton" onclick="goHome()">'

    +'⬅ Back'

    +'</button>';
}

function showAnswers(){

    document.getElementById("content")
        .innerHTML =

    '<h1>📖 Study Sheet</h1>'

    +

    '<img src="images/sheet'

    +currentSheet+

    '-labelled.jpg">'

    +

    '<button class="backButton" onclick="showSheetMenu('

    +currentSheet+

    ')">⬅ Back</button>';
}

function showWorksheet(){

    document.getElementById("content")
        .innerHTML =

    '<h1>✏️ Complete Worksheet</h1>'

    +

    '<img src="images/sheet'

    +currentSheet+

    '-blank.jpg">'

    +

    '<br><br>'

    +

    '<input placeholder="Spelling 1">'

    +

    '<input placeholder="Spelling 2">'

    +

    '<input placeholder="Spelling 3">'

    +

    '<input placeholder="Spelling 4">'

    +

    '<input placeholder="Spelling 5">'

    +

    '<input placeholder="Spelling 6">'

    +

    '<input placeholder="Spelling 7">'

    +

    '<input placeholder="Spelling 8">'

    +

    '<button class="backButton" onclick="showSheetMenu('

    +currentSheet+

    ')">⬅ Back</button>';
}

function goHome(){

    document.getElementById("content")
        .style.display = "none";

    document.getElementById("menu")
        .style.display = "block";
}

</script>

</body>

</html>
